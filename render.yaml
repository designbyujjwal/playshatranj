# Render blueprint: the game and its small multiplayer server (invite rooms and the live duel link) as one web service
services:
  - type: web
    name: shatranj
    runtime: node
    plan: free
    branch: royal-study
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
